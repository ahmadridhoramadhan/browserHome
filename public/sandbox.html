<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Sandbox</title>
  <style id="base-style">
    *, *::before, *::after {
      box-sizing: border-box;
      border: 0;
      outline: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #widget-root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      background-color: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
  </style>
  <style id="custom-style"></style>
</head>
<body style="background: transparent !important;">
  <div id="widget-root"></div>
  <div id="widget-error" style="display:none;margin:8px;padding:8px 12px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:8px;color:#fca5a5;font-size:11px;font-family:monospace;white-space:pre-wrap;"></div>

  <script src="sandbox.js"></script>
</body>
</html>
