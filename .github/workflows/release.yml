name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate automatic version tag
        id: version
        run: |
          PKG_VER=$(node -p "require('./package.json').version || '1.0.0'")

          if [ "$PKG_VER" = "0.0.0" ] || [ -z "$PKG_VER" ]; then
            PKG_VER="1.0"
          fi

          TAG_NAME="v${PKG_VER}.${{ github.run_number }}"

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "title=Release $TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "Tag versi yang dihasilkan: $TAG_NAME"

      - name: Package build artifacts
        run: |
          cd dist
          zip -r ../dist-${{ steps.version.outputs.tag }}.zip .
          tar -czf ../dist-${{ steps.version.outputs.tag }}.tar.gz .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-${{ steps.version.outputs.tag }}.zip
            dist-${{ steps.version.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
